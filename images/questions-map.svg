<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">Kaart van Nederlandse vraagsoorten</title>
  <desc id="desc">Een centrale vraag verbindt ja-nee-vragen, vraagwoorden, indirecte vragen en waar-daar-er-hier-combinaties.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9f5f0"/><stop offset="1" stop-color="#f8e8d8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter>
  </defs>
  <rect width="760" height="460" rx="36" fill="url(#bg)"/>
  <g fill="none" stroke="#7aa69c" stroke-width="3" stroke-linecap="round">
    <path d="M380 230 C300 160 250 125 155 115"/>
    <path d="M380 230 C460 155 520 125 620 112"/>
    <path d="M380 230 C305 300 245 338 145 348"/>
    <path d="M380 230 C455 305 525 342 630 346"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="380" cy="230" r="92" fill="#123f38"/>
    <text x="380" y="214" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="700">VRAAG</text>
    <text x="380" y="246" text-anchor="middle" fill="#d5ebe5" font-family="Arial, sans-serif" font-size="17">vorm · betekenis</text>
    <text x="380" y="271" text-anchor="middle" fill="#d5ebe5" font-family="Arial, sans-serif" font-size="17">toon · antwoord</text>
  </g>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="55" y="55" width="205" height="118" rx="24" fill="#fff"/>
    <text x="157" y="91" text-anchor="middle" fill="#123f38" font-size="20" font-weight="700">Ja / nee</text>
    <text x="157" y="120" text-anchor="middle" fill="#4f6e67" font-size="15">Woon je hier?</text>
    <text x="157" y="145" text-anchor="middle" fill="#4f6e67" font-size="15">Kun je komen?</text>

    <rect x="510" y="52" width="205" height="122" rx="24" fill="#fff"/>
    <text x="612" y="88" text-anchor="middle" fill="#123f38" font-size="20" font-weight="700">Vraagwoorden</text>
    <text x="612" y="118" text-anchor="middle" fill="#4f6e67" font-size="15">wie · wat · waar</text>
    <text x="612" y="143" text-anchor="middle" fill="#4f6e67" font-size="15">hoe · waarom · wanneer</text>

    <rect x="45" y="292" width="220" height="118" rx="24" fill="#fff"/>
    <text x="155" y="328" text-anchor="middle" fill="#123f38" font-size="20" font-weight="700">Indirect</text>
    <text x="155" y="357" text-anchor="middle" fill="#4f6e67" font-size="15">Weet je waar hij woont?</text>
    <text x="155" y="382" text-anchor="middle" fill="#4f6e67" font-size="15">Ik vraag of hij komt.</text>

    <rect x="500" y="288" width="225" height="125" rx="24" fill="#fff"/>
    <text x="612" y="324" text-anchor="middle" fill="#123f38" font-size="20" font-weight="700">Waar · daar · er</text>
    <text x="612" y="354" text-anchor="middle" fill="#4f6e67" font-size="15">waarmee → daarmee</text>
    <text x="612" y="379" text-anchor="middle" fill="#4f6e67" font-size="15">waarop → erop</text>
  </g>
  <g fill="#e56b45">
    <circle cx="279" cy="161" r="7"/><circle cx="481" cy="158" r="7"/><circle cx="280" cy="299" r="7"/><circle cx="481" cy="301" r="7"/>
  </g>
</svg>
