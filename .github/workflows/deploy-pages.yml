name: Deploy static website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "static-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Aquí NO hay pasos de build porque es una web 100% estática.
      # El contenido tal cual está en el repo es el que se desplegará.

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          # Si tu index.html está en la raíz del repo, deja esto:
          path: .

          # Si más adelante lo guardas en /public o /dist,
          # cambia path: ./public o path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
